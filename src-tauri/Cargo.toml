[package]
name = "folder-scanner"
version = "0.1.0"
description = "Сканер папок"
authors = ["Folder Scanner"]
edition = "2021"

[lib]
name = "folder_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
sysinfo = "0.33"

[target.'cfg(windows)'.dependencies]
ntfs-reader = "0.4.6"
windows = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
] }


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
