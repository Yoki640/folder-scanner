name: Build & Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build (portable + NSIS + MSI)
        run: npm run tauri build -- --bundles nsis,msi

      - name: Copy portable executable
        run: Copy-Item src-tauri\target\release\folder-scanner.exe FolderScanner-windows.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FolderScanner-Windows
          path: |
            FolderScanner-windows.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload release assets (Windows)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: |
            FolderScanner-windows.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          allowUpdates: true
          replacesArtifacts: true
          updateOnlyUnreleased: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: false
          makeLatest: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install dependencies
        run: npm ci

      - name: Build (AppImage + deb)
        run: npm run tauri build -- --bundles appimage,deb

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FolderScanner-Linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload release assets (Linux)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          allowUpdates: true
          replacesArtifacts: true
          updateOnlyUnreleased: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: false
          makeLatest: false
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build (.app)
        run: npm run tauri build -- --bundles app

      - name: Package (macOS zip)
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -r -y FolderScanner-macos.zip FolderScanner.app
          cd ../../../../..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderScanner-macOS
          path: src-tauri/target/release/bundle/macos/FolderScanner-macos.zip
          if-no-files-found: error

      - name: Upload release assets (macOS)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: src-tauri/target/release/bundle/macos/FolderScanner-macos.zip
          allowUpdates: true
          replacesArtifacts: true
          updateOnlyUnreleased: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: false
          makeLatest: false
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}