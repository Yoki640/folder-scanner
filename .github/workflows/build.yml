name: Build & Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build-win-linux:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            artifact_name: FolderScanner-Linux
          - os: windows-latest
            platform: windows
            artifact_name: FolderScanner-Windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller
          pip install xxhash || true

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: pyinstaller --onefile --windowed --hidden-import=xxhash --name="FolderScanner" scanner.py

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: pyinstaller --onefile --windowed --hidden-import=xxhash --name="FolderScanner" scanner.py

      - name: Package (Linux AppImage)
        if: matrix.platform == 'linux'
        run: |
          set -e
          mkdir -p AppDir/usr/bin
          cp dist/FolderScanner AppDir/usr/bin/FolderScanner
          chmod +x AppDir/usr/bin/FolderScanner

          cat > AppDir/FolderScanner.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=FolderScanner
          Exec=FolderScanner
          Icon=FolderScanner
          Categories=Utility;FileTools;
          Terminal=false
          EOF

          python -c "
          from struct import pack
          import zlib
          def chunk(t, d):
              c = t + d
              return pack('>I', len(d)) + c + pack('>I', zlib.crc32(c) & 0xffffffff)
          sig = b'\x89PNG\r\n\x1a\n'
          ihdr = chunk(b'IHDR', pack('>IIBBBBB', 1, 1, 8, 6, 0, 0, 0))
          idat = chunk(b'IDAT', zlib.compress(b'\x00\x00\x00\x00\x00'))
          iend = chunk(b'IEND', b'')
          open('AppDir/FolderScanner.png', 'wb').write(sig + ihdr + idat + iend)
          "

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir dist/FolderScanner-linux.AppImage

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        run: |
          copy dist\FolderScanner.exe FolderScanner-windows.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            FolderScanner-windows.exe
            dist/*.AppImage
          if-no-files-found: ignore

      - name: Upload release assets (Linux)
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'linux'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "dist/*.AppImage"
          allowUpdates: true
          replacesArtifacts: true
          updateOnlyUnreleased: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: false
          makeLatest: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "FolderScanner-windows.exe"
          allowUpdates: true
          replacesArtifacts: true
          updateOnlyUnreleased: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: false
          makeLatest: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller
          pip install xxhash || true

      - name: Build (macOS .app)
        run: |
          pyinstaller --windowed --hidden-import=xxhash --name="FolderScanner" scanner.py
          cd dist
          zip -r -y FolderScanner-macos.zip FolderScanner.app
          cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderScanner-macOS
          path: dist/FolderScanner-macos.zip
          if-no-files-found: ignore

      - name: Upload release assets (macOS)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          artifacts: "dist/FolderScanner-macos.zip"
          allowUpdates: true
          replacesArtifacts: true
          updateOnlyUnreleased: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: false
          makeLatest: false
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}